name: Sync expertise choices for content
on:
  push:
    branches: [main]
    paths: [content/cms/expertise.json, content/cms/experience.json, scripts/sync_expertise.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-expertise
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/sync_expertise.py
      - name: Save updated dropdown choices
        run: |
          if ! git diff --quiet -- .pages.yml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .pages.yml
            git commit -m 'Sync content expertise choices from Expertise'
            git push origin HEAD:main
          fi
