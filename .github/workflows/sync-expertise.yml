name: Sync CMS content choices
on:
  push:
    branches: [main]
    paths: ['content/cms/**', .pages.yml, scripts/sync_expertise.py, scripts/sync_related_content.py, related_content.py, content_archives.py, content_paths.py, cms_data.py, scripts/sync_projects.py, gallery_images.py, requirements.txt, scripts/prepare_gallery_cache.py, dist/assets/**, .github/workflows/sync-expertise.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-expertise
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync CMS and persist gallery renditions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Retry from the newest CMS snapshot if an editor saves during encoding.
          # This reset is confined to the disposable Actions checkout.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/sync_expertise.py
            python scripts/sync_related_content.py
            python scripts/sync_projects.py
            python scripts/prepare_gallery_cache.py
            git add .pages.yml content/cms media/gallery-cache
            if git diff --cached --quiet; then
              exit 0
            fi
            if git diff --cached --quiet -- .pages.yml content/cms; then
              # Only cache data changed: no extra Pages deployment is needed.
              git commit -m '[CF-Pages-Skip] Cache gallery renditions'
            else
              git commit -m 'Sync CMS choices, stable identifiers and project order'
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'CMS changed repeatedly; could not persist cache after three attempts.' >&2
          exit 1
