name: Sync CMS content choices
on:
  push:
    branches: [main]
    paths: ['content/cms/**', .pages.yml, scripts/sync_expertise.py, scripts/sync_related_content.py, related_content.py, content_archives.py, content_paths.py]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-expertise
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/sync_expertise.py
      - run: python scripts/sync_related_content.py
      - name: Save updated dropdown choices
        run: |
          if ! git diff --quiet -- .pages.yml content/cms; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .pages.yml content/cms
            git commit -m 'Sync CMS choices and stable bibliography identifiers'
            git push origin HEAD:main
          fi
