    {
      "name": "projects",
      "label": "Projekti",
      "type": "file",
      "path": "content/cms/projects.json",
      "format": "json",
      "fields": [
        {
          "name": "items",
          "label": "Projekti",
          "type": "object",
          "list": {
            "collapsible": {
              "collapsed": true,
              "summary": "{index}. {title}"
            }
          },
          "description": "CMS i sajt automatski sortiraju projekte od najnovijeg ka najstarijem: po Završetku angažmana, a kada je Angažman u toku uključen, po Početku angažmana. Za jednake datume ostaje postojeći redosled; unosi bez odgovarajućeg datuma su na kraju. Posle Save sačekajte automatsku obradu i ponovo učitajte CMS.",
          "fields": [
            {
              "name": "title",
              "label": "Akronim",
              "type": "string",
              "required": true
            },
            {
              "name": "full_name",
              "label": "Pun naziv projekta",
              "type": "string"
            },
            {
              "name": "path",
              "label": "Trajna adresa projekta",
              "type": "string",
              "required": true,
              "description": "Jedinstvena putanja, npr. /project/naziv-projekta. Posle objavljivanja sačuvajte ovu adresu i pri promeni naziva ili redosleda projekta. Ako adresu ipak menjate, potrebno je dodati trajno preusmerenje sa stare adrese."
            },
            {
              "name": "topic",
              "label": "Izbor oblasti",
              "type": "select",
              "options": {
                "values": [
                  "Leadership and Governance",
                  "Project and Programme Management",
                  "Blue Economy and Skills Development",
                  "Environmental Research and Policy",
                  "Climate and Energy Planning"
                ],
                "placeholder": "Izaberite oblast ekspertize"
              },
              "description": "Lista se automatski usklađuje sa CMS stranicom Expertise nakon čuvanja izmena. Ponovo učitajte CMS da vidite ažurirane nazive."
            },
            {
              "name": "image",
              "label": "Fotografija projekta",
              "type": "image",
              "options": {
                "media": "images"
              }
            },
            {
              "name": "image_alt",
              "label": "Opis fotografije",
              "type": "string"
            },
            {
              "name": "summary",
              "label": "Kratak opis za početnu stranu",
              "type": "text"
            },
            {
              "name": "role",
              "label": "Uloga",
              "type": "string"
            },
            {
              "name": "assignment_start",
              "label": "Početak angažmana",
              "type": "date",
              "options": {
                "format": "yyyy-MM-dd"
              },
              "description": "Za tekući angažman ovo je datum za sortiranje u CMS-u, na Projects i u Selected work."
            },
            {
              "name": "assignment_end",
              "label": "Završetak angažmana",
              "type": "date",
              "options": {
                "format": "yyyy-MM-dd"
              },
              "description": "Za završen angažman određuje redosled u CMS-u, na Projects i u Selected work. Za tekući angažman ovaj datum se ne koristi za sortiranje."
            },
            {
              "name": "assignment_ongoing",
              "label": "Angažman u toku",
              "type": "boolean",
              "default": false,
              "description": "Na sajtu se prikazuje present. Odnosi se na Vaš angažman, a ne na trajanje projekta."
            },
            {
              "name": "project_start",
              "label": "Početak projekta",
              "type": "date",
              "options": {
                "format": "yyyy-MM-dd"
              },
              "description": "Ukupno trajanje projekta; nije period Vašeg angažmana."
            },
            {
              "name": "project_end",
              "label": "Završetak projekta",
              "type": "date",
              "options": {
                "format": "yyyy-MM-dd"
              },
              "description": "Planirani ili stvarni završetak projekta."
            },
            {
              "name": "body",
              "label": "Pregled projekta",
              "type": "rich-text",
              "options": {
                "format": "html",
                "media": "images"
              },
              "description": "Project overview — postojeći detaljni opis je sačuvan ovde. Po potrebi rasporedite tekst u polja Uloga, Moj doprinos i Ostvareni rezultati."
            },
            {
              "name": "contribution",
              "label": "Moj doprinos",
              "type": "rich-text",
              "options": {
                "format": "html",
                "media": "images"
              }
            },
            {
              "name": "results",
              "label": "Ostvareni rezultati",
              "type": "rich-text",
              "options": {
                "format": "html",
                "media": "images"
              }
            },
            {
              "name": "related_content",
              "label": "Related contents",
              "type": "object",
              "description": "Izaberite povezane sadržaje direktno iz kolekcija Journal, Video, Galerije i Bibliography. Moguć je izbor više stavki uz pretragu. Povezane galerije automatski dobijaju link ka projektu.",
              "fields": [
                {
                  "name": "journal",
                  "label": "Journal / Blog objave",
                  "type": "reference",
                  "options": {
                    "collection": "posts",
                    "multiple": true,
                    "search": "title,excerpt,topic",
                    "value": "{fields.path}",
                    "label": "{fields.title}"
                  },
                  "description": "Pretražite i izaberite jednu ili više stavki direktno iz Blog objava. Naslovi se preuzimaju iz kolekcije, bez statičke liste. Veza na sajtu prikazuje se kada je izabrana objava objavljena."
                },
                {
                  "name": "videos",
                  "label": "Video",
                  "type": "reference",
                  "options": {
                    "collection": "video_entries",
                    "multiple": true,
                    "search": "title,excerpt,topic",
                    "value": "{fields.link}",
                    "label": "{fields.title}"
                  },
                  "description": "Pretražite i izaberite jednu ili više stavki direktno iz kolekcije."
                },
                {
                  "name": "galleries",
                  "label": "Galleries / Galerije",
                  "type": "reference",
                  "options": {
                    "collection": "gallery_entries",
                    "multiple": true,
                    "search": "title,summary,topic",
                    "value": "{fields.path}",
                    "label": "{fields.title}"
                  },
                  "description": "Pretražite i izaberite jednu ili više stavki direktno iz kolekcije."
                },
                {
                  "name": "bibliography",
                  "label": "Bibliography",
                  "type": "reference",
                  "options": {
                    "collection": "bibliography_entries",
                    "multiple": true,
                    "search": "title,authors,year,reference",
                    "value": "{fields.id}",
                    "label": "{fields.title} ({fields.year})"
                  },
                  "description": "Pretražite i izaberite jednu ili više stavki direktno iz kolekcije."
                }
              ]
            }
          ]
        }
      ],
      "operations": {
        "delete": false,
        "rename": false
      }
    },
